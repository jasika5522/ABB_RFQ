<app-page-header
  title="Create RFQ"
  [breadcrumbs]="[
    { label: 'Procurement', route: '/procurement/dashboard' },
    { label: 'RFQs', route: '/procurement/rfqs' },
    { label: 'Create' }
  ]"
></app-page-header>

@if (errorMessage) {
  <div class="error-banner" role="alert">{{ errorMessage }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()" class="card form-card">
  <h2>RFQ information</h2>
  <div class="form-field">
    <label for="rfqNumber">RFQ number</label>
    <input id="rfqNumber" formControlName="rfqNumber" />
  </div>
  <div class="form-field">
    <label for="title">Title</label>
    <input id="title" formControlName="title" />
  </div>
  <div class="form-field">
    <label for="description">Description</label>
    <textarea id="description" formControlName="description" rows="3"></textarea>
  </div>
  <div class="form-field">
    <label for="currencyCode">Currency code</label>
    <input id="currencyCode" formControlName="currencyCode" maxlength="3" />
  </div>

  <h2>Mandatory items</h2>
  <div formArrayName="items" class="items-list">
    @for (item of items.controls; track i; let i = $index) {
      <div class="item-row" [formGroupName]="i">
        <div class="form-field">
          <label>Item name</label>
          <input formControlName="itemName" />
        </div>
        <div class="form-field">
          <label>Description</label>
          <input formControlName="description" />
        </div>
        <div class="form-field narrow">
          <label>Quantity</label>
          <input type="number" step="0.001" min="0.001" formControlName="quantity" />
        </div>
        <div class="form-field narrow">
          <label>Unit</label>
          <input formControlName="unit" />
        </div>
        @if (items.length > 1) {
          <button type="button" class="btn btn-outline" (click)="removeItem(i)">Remove</button>
        }
      </div>
    }
  </div>
  <button type="button" class="btn btn-secondary" (click)="addItem()">Add item</button>

  <div class="actions">
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">
      {{ saving ? 'Saving…' : 'Create RFQ' }}
    </button>
    <a routerLink="/procurement/rfqs" class="btn btn-outline">Cancel</a>
  </div>
</form>
